name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (for example v0.0.5)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x86_64, ext: tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, platform: macos-x86_64, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-aarch64, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64, ext: zip }
    defaults:
      run:
        shell: bash
        working-directory: ./workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./workspace -> target

      - name: Build
        run: cargo build --release --locked -p commit-wizard --target ${{ matrix.target }}

      - name: Package
        run: |
          NAME="cw-${TAG}-${{ matrix.platform }}"
          mkdir -p "dist/$NAME"
          BIN=cw
          if [ "${{ matrix.ext }}" = "zip" ]; then BIN=cw.exe; fi
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$NAME/"
          cp ../LICENSE ../README.md "dist/$NAME/"
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          rm -rf "$NAME"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cw-${{ matrix.platform }}
          path: workspace/dist/*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum cw-* > SHASUMS256.txt

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
