name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main
      - develop
      - 'release/*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            workspace -> target

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            workspace -> target

      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features --locked

  docs:
    name: docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace
    env:
      # Broken links and invalid examples in the docs fail the build.
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            workspace -> target

      - name: Build the API docs
        run: cargo doc --workspace --no-deps --locked

      - name: Run the doctests
        run: cargo test --workspace --doc --locked

  package:
    name: package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            workspace -> target

      # Packages the crate as crates.io would, then builds it from the tarball.
      - name: Check the crate can be published
        run: cargo publish -p commit-wizard --dry-run --locked

      - name: Check the license files ship with the crate
        run: |
          cargo package -p commit-wizard --locked --list | grep -x 'LICENSE-MIT'
          cargo package -p commit-wizard --locked --list | grep -x 'LICENSE-APACHE'
          cargo package -p commit-wizard --locked --list | grep -x 'README.md'

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must match rust-version in crates/commit-wizard/Cargo.toml.
      - name: Install the minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            workspace -> target

      - name: Check the workspace builds on the minimum version
        run: cargo check --workspace --all-targets --locked

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            workspace -> target

      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features --locked

  windows:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            workspace -> target

      - name: Build
        run: cargo build --workspace --locked

      - name: Show where cw keeps its files
        shell: bash
        run: |
          git init "$RUNNER_TEMP/probe"
          cd "$RUNNER_TEMP/probe"
          "$GITHUB_WORKSPACE/workspace/target/debug/cw" config -g path
          "$GITHUB_WORKSPACE/workspace/target/debug/cw" doctor | grep -iE "state_file|registry"
          "$GITHUB_WORKSPACE/workspace/target/debug/cw" init registry ./reg >/dev/null
          printf 'version = 1\n[registries.r]\nurl = "file://%s/reg"\n[registry]\nuse = "r"\n' "$(pwd)" > .cwizard.toml
          "$GITHUB_WORKSPACE/workspace/target/debug/cw" config list --effective >/dev/null || true
          echo "LOCALAPPDATA=$LOCALAPPDATA APPDATA=$APPDATA"
          ls -R "$LOCALAPPDATA/cwizard" 2>/dev/null | head -20 || true

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked --no-fail-fast

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            workspace -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-targets --all-features --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: workflows/lcov.info

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            workspace -> target

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
